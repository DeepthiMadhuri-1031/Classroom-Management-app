<!DOCTYPE html>
<html>
<head>

<title>Booking</title>
<link rel="stylesheet" href="style.css">

<style>

.container{
width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

.free{
background:green;
color:white;
padding:5px;
}

.booked{
background:red;
color:white;
padding:5px;
}

</style>

</head>

<body>

<h1 align="center">Classroom Booking</h1>

<div class="container">

<label>Choose Classroom</label>
<select id="room">
<option>Room 101</option>
<option>Room 102</option>
<option>Lab 1</option>
<option>Lab 2</option>
<option>Room 205</option>
<option>CP Lab</option>
</select>

<br><br>

<label>Select Date</label>
<input type="date">

<br><br>

<label>Time Slot</label>
<select id="time">
<option>9 - 10</option>
<option>10 - 11</option>
<option>11 - 12</option>
<option>1 - 2</option>
<option>2 - 3</option>
<option>3 - 4</option>
</select>

<br><br>

<button onclick="book()">Book</button>
<button onclick="cancel()">Cancel</button>

<p id="msg"></p>

</div>

<script>

function book()
{
document.getElementById("msg").innerHTML =
"<span class='free'>Booked Successfully</span>";
}

function cancel()
{
document.getElementById("msg").innerHTML =
"<span class='booked'>Booking Cancelled</span>";
}

</script>

</body>
</html>
